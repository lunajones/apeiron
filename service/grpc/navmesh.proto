syntax = "proto3";

package grpc;

option go_package = "github.com/lunajones/apeiron/service/grpc;grpc";

// Snapshot de um polígono do NavMesh
message NavMeshSnapshot {
  int32 id = 1;
  int32 gridX = 2;
  int32 gridZ = 3;
  float offsetX = 4;
  float offsetZ = 5;
  float y = 6;
  float slope = 7;
  string areaType = 8;
  repeated int32 neighbors = 9;
}

// Lote de snapshots enviados pelo servidor
message NavMeshSnapshotBatch {
  repeated NavMeshSnapshot polygons = 1;
}

// Requisição (ainda vazia, pode ser estendida no futuro)
message NavMeshStreamRequest {
  string zone = 1;
}

// Serviço gRPC para envio do NavMesh
service NavMeshService {
  rpc StreamNavMeshUpdates(NavMeshStreamRequest) returns (stream NavMeshSnapshotBatch);
}
